<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1120" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .mono{font-family:'Courier New',monospace;letter-spacing:1.5px}
      .ink{fill:#f5f5fc}.faint{fill:#7a7a88}.amber{fill:#ffab4d}.cool{fill:#7d95ff}
      .disp{font-weight:700}
    </style>
  </defs>
  <rect x="0" y="0" width="1720" height="1120" fill="#050507"/>
  <text x="60" y="52" class="ink disp" font-size="30">Prophexy — reading page, four zones</text>
  <text x="60" y="80" class="faint mono" font-size="15">DESKTOP (left) · MOBILE (right) — same content, different layout · draw on it, tell me what's wrong</text>

  <!-- ============ DESKTOP FRAME ============ -->
  <rect x="60" y="110" width="1040" height="960" rx="10" fill="#0b0b10" stroke="#23232e"/>
  <!-- masthead -->
  <circle cx="92" cy="150" r="10" fill="none" stroke="#f5f5fc" stroke-width="1.5"/><circle cx="92" cy="150" r="3.5" class="amber"/>
  <text x="114" y="155" class="ink mono" font-size="15">PROPHEXY</text>
  <text x="1068" y="145" class="faint mono" font-size="12" text-anchor="end">MAYA</text>
  <text x="1068" y="163" class="faint mono" font-size="12" text-anchor="end">31 AUG · PORTLAND</text>
  <line x1="60" y1="184" x2="1100" y2="184" stroke="#23232e"/>

  <!-- ZONE 1 : THE READING -->
  <rect x="60" y="184" width="1040" height="250" fill="#0d0b08"/>
  <text x="88" y="220" class="amber mono" font-size="13">① THE READING · animated reveal</text>
  <text x="88" y="280" class="ink disp" font-size="42">Tend to one person,</text>
  <text x="88" y="326" class="ink disp" font-size="42">including you.</text>
  <text x="88" y="368" class="faint" font-size="15">Today is a 6 day for you — a day for care and home. The moon is</text>
  <text x="88" y="392" class="faint" font-size="15">waning, 91% lit, past full and letting go. Monday belongs to the</text>
  <text x="88" y="416" class="faint" font-size="15">Moon, which brings feeling and shifting moods.</text>
  <!-- moon visual right -->
  <circle cx="960" cy="315" r="80" fill="#161620" stroke="#2a2a36"/>
  <circle cx="985" cy="315" r="80" fill="#0d0b08" opacity="0.9"/>
  <text x="960" y="420" class="faint mono" font-size="11" text-anchor="middle">LIVE SKY + MOON</text>
  <line x1="60" y1="434" x2="1100" y2="434" stroke="#23232e"/>

  <!-- ZONE 2 : THE REASONING -->
  <rect x="60" y="434" width="1040" height="270" fill="#080a0f"/>
  <text x="88" y="470" class="cool mono" font-size="13">② THE REASONING · why it reads this way — cooler, data-like, distinct</text>
  <!-- three data cards -->
  <g>
    <rect x="88" y="486" width="300" height="190" fill="#0b0d14" stroke="#26304a"/>
    <text x="106" y="514" class="cool mono" font-size="11">THE SKY</text>
    <text x="106" y="548" class="ink" font-size="16">Waning gibbous · 91%</text>
    <text x="106" y="572" class="faint" font-size="13">Sun in Virgo · Moon in Aries</text>
    <line x1="106" y1="606" x2="370" y2="606" stroke="#1c2436"/>
    <text x="106" y="636" class="amber mono" font-size="10">MEANS FOR YOU →</text>
    <text x="106" y="658" class="faint" font-size="12.5">A night that favours letting go.</text>
  </g>
  <g>
    <rect x="408" y="486" width="300" height="190" fill="#0b0d14" stroke="#26304a"/>
    <text x="426" y="514" class="cool mono" font-size="11">YOUR NUMBERS</text>
    <text x="426" y="548" class="ink" font-size="16">1·10 + 31·8 → a 6 day</text>
    <text x="426" y="572" class="faint" font-size="13">Life path 5 · name number 5</text>
    <line x1="426" y1="606" x2="690" y2="606" stroke="#1c2436"/>
    <text x="426" y="636" class="amber mono" font-size="10">MEANS FOR YOU →</text>
    <text x="426" y="658" class="faint" font-size="12.5">A day to care, not to push.</text>
  </g>
  <g>
    <rect x="728" y="486" width="350" height="190" fill="#0b0d14" stroke="#26304a"/>
    <text x="746" y="514" class="cool mono" font-size="11">THE SYSTEMS</text>
    <text x="746" y="548" class="ink" font-size="16">Western · Vedic · Chinese</text>
    <text x="746" y="572" class="faint" font-size="13">Libra / Virgo / Water Monkey</text>
    <line x1="746" y1="606" x2="1060" y2="606" stroke="#1c2436"/>
    <text x="746" y="636" class="amber mono" font-size="10">MEANS FOR YOU →</text>
    <text x="746" y="658" class="faint" font-size="12.5">Where they rhyme is worth trusting.</text>
  </g>
  <line x1="60" y1="704" x2="1100" y2="704" stroke="#23232e"/>

  <!-- ZONE 3 : THE INTERACTIVE -->
  <rect x="60" y="704" width="1040" height="180" fill="#0d0b08"/>
  <text x="88" y="740" class="amber mono" font-size="13">③ THE INTERACTIVE · compact tiles — distinct, don't eat space</text>
  <g font-size="12">
    <rect x="88" y="756" width="150" height="96" fill="#120d06" stroke="#5a3f16"/><text x="104" y="812" class="ink">Draw the cards</text><text x="104" y="834" class="faint mono" font-size="10">TAROT · Q-BANK</text>
    <rect x="250" y="756" width="150" height="96" fill="#120d06" stroke="#5a3f16"/><text x="266" y="812" class="ink">Tell a dream</text><text x="266" y="834" class="faint mono" font-size="10">READS ON CONNECT</text>
    <rect x="412" y="756" width="150" height="96" fill="#120d06" stroke="#5a3f16"/><text x="428" y="812" class="ink">Read my palm</text><text x="428" y="834" class="faint mono" font-size="10">PHOTO</text>
    <rect x="574" y="756" width="150" height="96" fill="#120d06" stroke="#5a3f16"/><text x="590" y="812" class="ink">Read my face</text><text x="590" y="834" class="faint mono" font-size="10">PHOTO</text>
    <rect x="736" y="756" width="150" height="96" fill="#120d06" stroke="#5a3f16"/><text x="752" y="812" class="ink">Vision board</text><text x="752" y="834" class="faint mono" font-size="10">CALLING IN</text>
    <rect x="898" y="756" width="180" height="96" fill="#120d06" stroke="#5a3f16"/><text x="914" y="812" class="ink">Check in · mood</text><text x="914" y="834" class="faint mono" font-size="10">HOW ARE YOU</text>
  </g>
  <line x1="60" y1="884" x2="1100" y2="884" stroke="#23232e"/>

  <!-- ZONE 4 : CHATBOT -->
  <rect x="60" y="884" width="1040" height="186" fill="#07090c"/>
  <text x="88" y="920" class="cool mono" font-size="13">④ THE CHATBOT · its own surface — sees your dreams, moods &amp; board</text>
  <rect x="88" y="936" width="990" height="60" rx="6" fill="#101018" stroke="#2a2a3a"/>
  <text x="108" y="972" class="faint" font-size="15">Ask me anything — about today, a person, a decision…</text>
  <rect x="1006" y="948" width="56" height="36" rx="5" fill="#ffab4d"/><text x="1034" y="971" fill="#000" class="mono" font-size="12" text-anchor="middle">ASK</text>
  <text x="88" y="1024" class="faint mono" font-size="11">CONTEXT IT CAN READ:  ▸ your chart   ▸ your dreams   ▸ your moods   ▸ your journal   ▸ your board</text>

  <!-- ============ MOBILE FRAME ============ -->
  <rect x="1160" y="110" width="330" height="960" rx="26" fill="#0b0b10" stroke="#23232e"/>
  <rect x="1160" y="110" width="330" height="52" rx="26" fill="#0d0d13"/>
  <circle cx="1188" cy="150" r="8" fill="none" stroke="#f5f5fc"/><circle cx="1188" cy="150" r="2.5" class="amber"/>
  <text x="1204" y="155" class="ink mono" font-size="12">PROPHEXY</text>
  <text x="1470" y="155" class="faint mono" font-size="9" text-anchor="end">MAYA · 31 AUG</text>
  <!-- sticky tabs -->
  <rect x="1160" y="162" width="330" height="30" fill="#0a0a0f"/>
  <text x="1176" y="182" class="amber mono" font-size="10">READ</text>
  <text x="1240" y="182" class="faint mono" font-size="10">WHY</text>
  <text x="1300" y="182" class="faint mono" font-size="10">DO</text>
  <text x="1350" y="182" class="faint mono" font-size="10">ASK</text>
  <text x="1420" y="182" class="faint mono" font-size="10">AHEAD</text>

  <!-- reading -->
  <circle cx="1325" cy="248" r="46" fill="#161620" stroke="#2a2a36"/><circle cx="1342" cy="248" r="46" fill="#0b0b10" opacity="0.9"/>
  <text x="1180" y="330" class="amber mono" font-size="9">① THE READING</text>
  <text x="1180" y="360" class="ink disp" font-size="22">Tend to one</text>
  <text x="1180" y="386" class="ink disp" font-size="22">person.</text>
  <text x="1180" y="412" class="faint" font-size="11.5">A 6 day — care and home. The</text>
  <text x="1180" y="430" class="faint" font-size="11.5">moon is waning, letting go.</text>
  <line x1="1160" y1="452" x2="1490" y2="452" stroke="#20202a"/>

  <!-- reasoning -->
  <text x="1180" y="482" class="cool mono" font-size="9">② THE REASONING</text>
  <rect x="1180" y="494" width="290" height="52" fill="#0b0d14" stroke="#26304a"/><text x="1194" y="516" class="ink" font-size="12">The sky · waning 91%</text><text x="1194" y="536" class="amber mono" font-size="9">→ a night to let go</text>
  <rect x="1180" y="552" width="290" height="52" fill="#0b0d14" stroke="#26304a"/><text x="1194" y="574" class="ink" font-size="12">Your numbers · a 6 day</text><text x="1194" y="594" class="amber mono" font-size="9">→ care, don't push</text>
  <line x1="1160" y1="624" x2="1490" y2="624" stroke="#20202a"/>

  <!-- interactive -->
  <text x="1180" y="652" class="amber mono" font-size="9">③ THE INTERACTIVE</text>
  <g font-size="11">
    <rect x="1180" y="664" width="140" height="60" fill="#120d06" stroke="#5a3f16"/><text x="1194" y="700" class="ink">Draw cards</text>
    <rect x="1330" y="664" width="140" height="60" fill="#120d06" stroke="#5a3f16"/><text x="1344" y="700" class="ink">Tell a dream</text>
    <rect x="1180" y="732" width="140" height="60" fill="#120d06" stroke="#5a3f16"/><text x="1194" y="768" class="ink">Palm / Face</text>
    <rect x="1330" y="732" width="140" height="60" fill="#120d06" stroke="#5a3f16"/><text x="1344" y="768" class="ink">Check in</text>
  </g>
  <line x1="1160" y1="812" x2="1490" y2="812" stroke="#20202a"/>

  <!-- ahead -->
  <text x="1180" y="840" class="faint mono" font-size="9">⑤ THE WEEK AHEAD · calendar</text>
  <g>
    <rect x="1180" y="852" width="40" height="54" fill="#0c0c12" stroke="#20202a"/>
    <rect x="1222" y="852" width="40" height="54" fill="#120d06" stroke="#5a3f16"/>
    <rect x="1264" y="852" width="40" height="54" fill="#0c0c12" stroke="#20202a"/>
    <rect x="1306" y="852" width="40" height="54" fill="#0c0c12" stroke="#20202a"/>
    <rect x="1348" y="852" width="40" height="54" fill="#0c0c12" stroke="#20202a"/>
    <rect x="1390" y="852" width="40" height="54" fill="#0c0c12" stroke="#20202a"/>
    <rect x="1432" y="852" width="40" height="54" fill="#0c0c12" stroke="#20202a"/>
    <rect x="1186" y="898" width="28" height="3" class="faint"/><rect x="1228" y="892" width="28" height="9" class="amber"/><rect x="1270" y="896" width="28" height="5" class="faint"/>
  </g>

  <!-- docked chat button -->
  <rect x="1180" y="1006" width="290" height="44" rx="22" fill="#101018" stroke="#ffab4d"/>
  <circle cx="1206" cy="1028" r="6" class="amber"/>
  <text x="1224" y="1033" class="ink" font-size="13">Ask — I know your dreams &amp; board</text>
  <text x="1180" y="1068" class="cool mono" font-size="9">④ CHATBOT docked → opens full-screen</text>
</svg>
